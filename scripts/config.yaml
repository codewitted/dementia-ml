# Configuration file for dementia-ml project

# Data paths
data:
  raw_dir: "../data/raw"
  clinical_file: "clinical.csv"
  processed_dir: "../data/processed"

# Model parameters
models:
  logistic_regression:
    max_iter: 1000
    random_state: 42
    solver: "lbfgs"
  
  random_forest:
    n_estimators: 100
    max_depth: null
    min_samples_split: 2
    min_samples_leaf: 1
    random_state: 42
    n_jobs: -1
  
  gradient_boosting:
    n_estimators: 100
    learning_rate: 0.1
    max_depth: 3
    random_state: 42
  
  cnn:
    num_classes: 2
    learning_rate: 0.001
    batch_size: 32
    epochs: 10
    image_size: [128, 128]
  
  ensemble:
    cv_folds: 5
    n_jobs: -1

# Feature configuration
features:
  numeric:
    - Age
    - EDUC
    - MMSE
    - eTIV
    - nWBV
    - ASF
  categorical:
    - M/F
  target: CDR

# Training parameters
training:
  test_size: 0.2
  random_state: 42
  stratify: true

# Output directories
outputs:
  models_dir: "../models"
  results_dir: "../outputs"
  figures_dir: "../outputs/figures"
  tables_dir: "../outputs/tables"

# Logging
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "../outputs/training.log"
